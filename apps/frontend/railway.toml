[build]
builder        = "DOCKERFILE"
dockerfilePath = "apps/frontend/Dockerfile"

# NEXT_PUBLIC_BACKEND_URL is baked into the Next.js build at compile time,
# so it must be forwarded as a Docker build argument from the Railway variable.
[build.args]
NEXT_PUBLIC_BACKEND_URL = "${{NEXT_PUBLIC_BACKEND_URL}}"

[deploy]
healthcheckPath        = "/"
healthcheckTimeout     = 300
restartPolicyType      = "ON_FAILURE"
restartPolicyMaxRetries = 3
